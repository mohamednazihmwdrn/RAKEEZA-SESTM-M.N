<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الموان | نظام الطباعة</title>
<style>
:root{--navy:#172536;--gold:#c7a15a;--line:#aeb8c2;--muted:#66717d;--bg:#edf1f5;--paper:#fff;--font:Tahoma,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:var(--font);color:#17212b}.toolbar{position:sticky;top:0;z-index:9;background:#fff;padding:12px;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid #d3dbe3}.toolbar label{display:flex;align-items:center;gap:8px}.toolbar select,.toolbar button{font:inherit;padding:10px 13px;border:1px solid #758292;border-radius:8px;background:#fff}.toolbar button{background:var(--navy);color:#fff;font-weight:bold;cursor:pointer}.toolbar .hint{font-size:12px;color:#66717d;width:100%;text-align:center}#preview{padding:16px 10px 30px}.page{background:#fff;margin:0 auto 20px;position:relative;box-shadow:0 4px 18px #15253620;page-break-after:always;break-after:page;overflow:hidden}.page:last-child{break-after:auto;page-break-after:auto}.a5 .page{width:148mm;min-height:210mm;padding:7mm}.a4 .page{width:210mm;min-height:297mm;padding:9mm}.frame{border:1.1px solid #273747;min-height:100%;padding:5mm;display:flex;flex-direction:column}.head{direction:ltr;display:grid;grid-template-columns:1fr 34mm 1fr;grid-template-areas:'phones logo company';align-items:center;gap:3mm;padding:0 0 4mm;border-bottom:2px solid var(--gold);margin-bottom:4mm}.phones{grid-area:phones;text-align:left;direction:ltr;font-size:9.5pt;line-height:1.75;color:#263544}.phones div{white-space:nowrap}.logo{grid-area:logo;display:flex;justify-content:center;align-items:center;min-height:24mm}.logo img{max-width:32mm;max-height:27mm;object-fit:contain}.logo-placeholder{width:27mm;height:25mm;border:1px dashed #aab5c0;color:#7a8794;display:flex;align-items:center;justify-content:center;text-align:center;font-size:9pt;line-height:1.5}.company{grid-area:company;direction:rtl;text-align:right;font-size:14pt;font-weight:700;line-height:1.5;color:var(--navy)}.branch{font-size:9pt;color:var(--muted);font-weight:normal;margin-top:1mm}.title-row{display:flex;align-items:center;justify-content:space-between;gap:5mm;margin:0 0 3.5mm}.title-row h1{font-size:16pt;margin:0;color:var(--navy)}.title-row .date{font-size:9.5pt;color:#344354}.meta{display:grid;grid-template-columns:1fr 1fr 1fr;border:1px solid var(--line);border-radius:2mm;overflow:hidden;margin-bottom:4mm}.meta-col{padding:2.8mm 3mm;font-size:9pt;line-height:1.8;border-left:1px solid var(--line)}.meta-col:last-child{border-left:0}.meta-center{text-align:center;font-weight:bold;font-size:12pt}.pair{display:flex;justify-content:space-between;gap:4mm}.pair b{font-weight:bold}.table{width:100%;border-collapse:collapse;font-size:9pt;margin-bottom:3mm}.table th,.table td{border:1px solid #aeb9c3;padding:2.4mm 1.8mm;text-align:center;vertical-align:middle}.table th{background:#e9eef3;color:#152536;font-weight:bold;border-bottom:2px solid #647384}.table td.item{text-align:right}.totals-area{direction:ltr;display:flex;justify-content:flex-start;margin:2mm 0 3mm}.totals{width:65%;border-top:1px solid var(--line);font-size:10pt}.total-line{direction:rtl;display:flex;justify-content:space-between;align-items:center;padding:2.6mm 1mm;border-bottom:1px dashed #aab4be;gap:5mm}.total-line .label{text-align:right}.total-line .value{direction:ltr;text-align:left;white-space:nowrap;font-weight:700}.total-line.main{font-size:13pt;font-weight:bold}.total-line.due{color:#9b4b00}.foot{margin-top:auto;border-top:1px solid var(--line);padding-top:3mm;display:flex;justify-content:space-between;gap:3mm;font-size:8pt;color:#65717e}.copyright{text-align:center;color:#65717e;font-size:8pt;margin-top:2.5mm}.data-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:2.5mm;margin:3mm 0}.card{border:1px solid var(--line);border-radius:2mm;padding:3mm;text-align:center}.card .k{font-size:8.5pt;color:#65717e;margin-bottom:2mm}.card .v{font-size:13pt;font-weight:bold;color:var(--navy)}.section{font-weight:bold;color:var(--navy);padding:2.5mm;background:#eef2f6;border:1px solid var(--line);margin:3mm 0 2mm}.notes{border:1px solid var(--line);padding:3mm;margin:2mm 0;font-size:9pt}.signatures{display:flex;justify-content:space-around;margin:9mm 0 4mm}.signatures span{width:27%;text-align:center;border-top:1px solid #65717e;padding-top:2mm;font-size:9pt}.page-num{font-size:8pt;color:#65717e}
/* Thermal */.thermal .page{width:80mm;min-height:0;padding:3mm;box-shadow:none}.thermal .frame{padding:2mm;border-color:#222}.thermal .head{grid-template-columns:1fr;grid-template-areas:'company' 'logo' 'phones';gap:1mm;text-align:center;padding-bottom:2mm;margin-bottom:2mm}.thermal .company{text-align:center;font-size:11pt}.thermal .phones{text-align:center;font-size:8pt}.thermal .logo{min-height:12mm}.thermal .logo-placeholder{width:20mm;height:12mm;font-size:7pt}.thermal .logo img{max-width:18mm;max-height:12mm}.thermal .title-row{display:block;text-align:center;margin-bottom:2mm}.thermal .title-row h1{font-size:11pt}.thermal .title-row .date{font-size:8pt}.thermal .meta{grid-template-columns:1fr;margin-bottom:2mm}.thermal .meta-col{border:0;border-bottom:1px solid #bbb;padding:1.5mm;font-size:8pt}.thermal .meta-col:last-child{border-bottom:0}.thermal .meta-center{font-size:10pt}.thermal .table{font-size:7.2pt}.thermal .table th,.thermal .table td{padding:1.2mm .7mm}.thermal .totals{width:100%;font-size:8.5pt}.thermal .total-line{padding:1.6mm}.thermal .total-line.main{font-size:10pt}.thermal .data-cards{grid-template-columns:1fr;gap:1.5mm}.thermal .card{padding:2mm}.thermal .card .v{font-size:10pt}.thermal .foot{font-size:7pt;flex-wrap:wrap}.thermal .copyright{font-size:7pt}.thermal .section{padding:1.5mm;font-size:8pt}.thermal .signatures{margin:5mm 0}.thermal .signatures span{font-size:7pt}
@media print{body{background:#fff}.toolbar{display:none!important}#preview{padding:0}.page{box-shadow:none;margin:0;overflow:visible}.a5 .page{width:148mm;min-height:210mm;padding:5mm}.a4 .page{width:210mm;min-height:297mm;padding:7mm}.frame{min-height:100%}.thermal .page{width:80mm;padding:2mm;min-height:0}.thermal .frame{min-height:0}@page{size:A5;margin:0}.a4 @page{size:A4;margin:0}.thermal @page{size:80mm auto;margin:0}.page{break-after:page}.page:last-child{break-after:auto}}
</style></head><body>
<div class="toolbar"><label>مقاس الطباعة <select id="size"><option value="a5">A5</option><option value="a4">A4</option><option value="thermal">حراري 80 مم</option></select></label><button onclick="window.print()">طباعة</button><div class="hint">قالب تصميم موحّد — نوع المستند وتقسيمته يحددهما القسم الذي يستدعي الطباعة والبيانات الفعلية المرسلة إليه.</div></div><div id="preview"></div>
<script>
const company={name:'مؤسسة الموان للحدايد والبويات ولوازم المعمار',branch:'الفرع الرئيسي',phones:['01008377405','01029190615'],logoUrl:''};
const sample={kind:'invoice',size:'a5',company,document:{title:'فاتورة مبيعات',number:'43',date:'2026-11-18',time:'19:53',party:'عميل نقدي',phone:'—',user:'—',paymentStatus:'مدفوع',paymentMethod:'نقدي',warehouse:'الخزينة الرئيسية'},rows:[{name:'بستلة معجون دايتون',description:'14 كجم - أبيض',qty:2,price:270,total:540},{name:'شيكارة معجون اسمنتي اسافيتو',description:'شيكارة',qty:1,price:220,total:220}],totals:{items:760,discount:0,net:760,paid:760,due:0},notes:''};
const money=n=>(Number(n||0)).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+' ج.م';const esc=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function header(c){return `<header class="head"><div class="phones">${(c.phones||[]).map((p,i)=>`<div>هاتف ${i+1}: ${esc(p)}</div>`).join('')}</div><div class="logo">${c.logoUrl?`<img src="${esc(c.logoUrl)}">`:'<div class="logo-placeholder">شعار<br>الموان</div>'}</div><div class="company">${esc(c.name)}<div class="branch">${esc(c.branch||'')}</div></div></header>`}
function title(d){return `<div class="title-row"><h1>${esc(d.title)}</h1><div class="date">${esc(d.date||'')} ${esc(d.time||'')}</div></div>`}
function meta(d){return `<div class="meta"><div class="meta-col"><div class="pair"><span>الطرف:</span><b>${esc(d.party||d.customer||d.supplier)}</b></div><div class="pair"><span>الهاتف:</span><b>${esc(d.phone)}</b></div><div class="pair"><span>طريقة الدفع:</span><b>${esc(d.paymentMethod)}</b></div></div><div class="meta-col meta-center">${esc(d.title)}<div style="font-weight:normal">رقم: ${esc(d.number)}</div>${d.paymentStatus?`<small>${esc(d.paymentStatus)}</small>`:''}</div><div class="meta-col"><div class="pair"><span>التاريخ:</span><b>${esc(d.date)}</b></div><div class="pair"><span>الوقت:</span><b>${esc(d.time)}</b></div><div class="pair"><span>المستخدم:</span><b>${esc(d.user)}</b></div></div></div>`}
function itemTable(rows){return `<table class="table"><thead><tr><th>م</th><th>اسم الصنف</th><th>البيان / المواصفات</th><th>العدد</th><th>السعر</th><th>الإجمالي</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td class="item">${esc(r.name)}</td><td>${esc(r.description||r.unit||'')}</td><td>${esc(r.qty)}</td><td>${money(r.price)}</td><td>${money(r.total??(Number(r.qty)*Number(r.price)))}</td></tr>`).join('')}</tbody></table>`}
function totals(t){let lines=[['إجمالي الأصناف',t.items],...(Number(t.discount)>0?[['الخصم',t.discount]]:[]),['الإجمالي المستحق',t.net,'main'],['المدفوع',t.paid],...(Number(t.due)>0?[['المتبقي (دين)',t.due,'due']]:[])];return `<div class="totals-area"><div class="totals">${lines.map(([label,val,cls])=>`<div class="total-line ${cls||''}"><span class="label">${label}:</span><span class="value">${money(val)}</span></div>`).join('')}</div></div>`}
function shell(d,body,i,total){return `<article class="page"><div class="frame">${header(d.company)}${title(d.document)}${body}${d.notes?`<div class="notes"><b>ملاحظات:</b> ${esc(d.notes)}</div>`:''}<footer class="foot"><span>${esc(d.company.name)}</span><span>${esc(d.document.number?'رقم '+d.document.number:'')}</span><span class="page-num">${i+1} / ${total}</span></footer></div><div class="copyright">حقوق الملكية الفكرية محفوظة لمطور النظام — Mohamed Nazih — 01029190615</div></article>`}
function invoice(d){let per=d.size==='thermal'?12:15,arr=d.rows||[],chunks=[];for(let i=0;i<arr.length;i+=per)chunks.push(arr.slice(i,i+per));if(!chunks.length)chunks=[[]];return chunks.map((chunk,i)=>shell(d,meta(d.document)+itemTable(chunk)+(i===chunks.length-1?totals(d.totals||{}):''),i,chunks.length)).join('')}
function statement(d){let t=d.totals||{},rows=d.rows||[];let body=`<div class="data-cards"><div class="card"><div class="k">رصيد سابق</div><div class="v">${money(t.opening)}</div></div><div class="card"><div class="k">إجمالي الحركة</div><div class="v">${money(t.movement)}</div></div><div class="card"><div class="k">الرصيد النهائي</div><div class="v">${money(t.closing)}</div></div></div><div class="section">كشف حركة الحساب</div><table class="table"><thead><tr><th>التاريخ</th><th>البيان</th><th>رقم المستند</th><th>مدين</th><th>دائن</th><th>الرصيد</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.date)}</td><td class="item">${esc(r.kind)}</td><td>${esc(r.number)}</td><td>${money(r.debit)}</td><td>${money(r.credit)}</td><td>${money(r.balance)}</td></tr>`).join('')}</tbody></table>`;return shell(d,body,0,1)}
function voucher(d){let x=d.document,t=d.totals||{};let body=`<div class="data-cards"><div class="card"><div class="k">رقم السند</div><div class="v">${esc(x.number)}</div></div><div class="card"><div class="k">المبلغ</div><div class="v">${money(t.amount)}</div></div><div class="card"><div class="k">الخزينة / الحساب</div><div class="v">${esc(x.account)}</div></div></div><div class="section">تفاصيل السند</div><div class="notes"><div class="pair"><span>اسم الطرف:</span><b>${esc(x.party)}</b></div><p><b>البيان:</b> ${esc(x.description)}</p><p><b>المبلغ كتابةً:</b> ${esc(x.amountWords||'')}</p></div><div class="signatures"><span>المستلم</span><span>المحاسب</span><span>الاعتماد</span></div>`;return shell(d,body,0,1)}
function shift(d){let t=d.totals||{},rows=d.rows||[];let cards=[['رصيد بداية الخزينة',t.opening],['مبيعات نقدية',t.cashSales],['تحصيلات',t.receipts],['مدفوعات / مصروفات',t.payments],['صافي الربح',t.profit],['الرصيد المتوقع',t.expected]];let variance=Number(t.actual||0)-Number(t.expected||0);let body=`<div class="data-cards">${cards.map(([k,v])=>`<div class="card"><div class="k">${k}</div><div class="v">${money(v)}</div></div>`).join('')}</div><div class="section">حركات الوردية</div><table class="table"><thead><tr><th>الحركة</th><th>القيمة</th><th>ملاحظات</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.kind)}</td><td>${money(r.amount)}</td><td>${esc(r.note)}</td></tr>`).join('')}</tbody></table><div class="totals-area"><div class="totals"><div class="total-line"><span class="label">الرصيد المتوقع:</span><span class="value">${money(t.expected)}</span></div><div class="total-line"><span class="label">الرصيد الفعلي:</span><span class="value">${money(t.actual)}</span></div><div class="total-line main"><span class="label">العجز / الزيادة:</span><span class="value">${money(variance)}</span></div></div></div>`;return shell(d,body,0,1)}
function report(d){let sections=d.sections||[],body=sections.map(s=>`<div class="section">${esc(s.title)}</div>${s.text?`<div class="notes">${esc(s.text)}</div>`:''}${s.rows?`<table class="table"><thead><tr>${s.columns.map(c=>`<th>${esc(c.label)}</th>`).join('')}</tr></thead><tbody>${s.rows.map(r=>`<tr>${s.columns.map(c=>`<td>${esc(r[c.key])}</td>`).join('')}</tr>`).join('')}</tbody></table>`:''}`).join('');return shell(d,body,0,1)}
function renderPrintDocument(data){document.body.classList.remove('a5','a4','thermal');document.body.classList.add(data.size||'a5');let ps=document.getElementById('dynamic-page-size');if(!ps){ps=document.createElement('style');ps.id='dynamic-page-size';document.head.appendChild(ps)}ps.textContent='@media print{@page{size:'+(data.size==='a4'?'A4':data.size==='thermal'?'80mm auto':'A5')+';margin:0}}';let html='';switch(data.kind){case'invoice':html=invoice(data);break;case'statement':html=statement(data);break;case'voucher':html=voucher(data);break;case'shift':html=shift(data);break;default:html=report(data)}document.getElementById('preview').innerHTML=html;window.currentPrintData=data}
function sampleFor(kind){let d=JSON.parse(JSON.stringify(sample));d.kind=kind;if(kind==='statement'){d.document={title:'كشف حساب عميل',number:'—',date:'من 01/11/2026 إلى 18/11/2026',party:'عميل تجريبي'};d.rows=[{date:'18/11/2026',kind:'فاتورة مبيعات رقم 43',number:'43',debit:760,credit:0,balance:760},{date:'18/11/2026',kind:'سند قبض',number:'12',debit:0,credit:300,balance:460}];d.totals={opening:0,movement:760,closing:460};}
if(kind==='voucher'){d.document={title:'سند قبض',number:'12',date:'18/11/2026',party:'عميل تجريبي',account:'الخزينة الرئيسية',description:'تحصيل دفعة من حساب العميل',amountWords:'ثلاثمائة جنيه فقط'};d.totals={amount:300}}
if(kind==='shift'){d.document={title:'تقرير إغلاق وردية',number:'—',date:'18/11/2026',time:'09:00 – 19:53',party:'الفرع الرئيسي'};d.totals={opening:2000,cashSales:3760,receipts:1000,payments:1200,profit:430,expected:5560,actual:5500};d.rows=[{kind:'مبيعات نقدية',amount:3760,note:'خلال الوردية'},{kind:'تحصيلات العملاء',amount:1000,note:'سندات قبض'},{kind:'مصروفات',amount:1200,note:'سندات صرف'}]}
if(kind==='report'){d.document={title:'تقرير أرصدة الخزائن',number:'',date:'18/11/2026'};d.sections=[{title:'ملخص التقرير',text:'معاينة تنسيق تقرير مستقل حسب نوع البيانات'},{title:'الأرصدة',columns:[{key:'name',label:'الخزينة'},{key:'balance',label:'الرصيد'}],rows:[{name:'الخزينة الرئيسية',balance:'5,500.00 ج.م'}]}]};return d}
document.getElementById('size').addEventListener('change',e=>renderPrintDocument({...window.currentPrintData,size:e.target.value}));renderPrintDocument(sample);
// Integration API: call with actual app record. Types: invoice, statement, voucher, shift, report.
window.renderPrintDocument=renderPrintDocument;
</script></body></html>
